<!DOCTYPE html>
<html lang="fr">
<head>
  <!-- Remplacé par la valeur de `flutter build web --base-href` (ex: "/puitstrack/"). -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="CPF Laboratory NAWARA — suivi personnel des analyses de puits : débits, ratios GOR/WOR/GLR/PI, courbe de déclin, interventions, exports Excel.">
  <meta name="theme-color" content="#FF7A33">
  <meta name="color-scheme" content="light dark">

  <!-- Installable comme une application (PWA, iOS) -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CPF Laboratory NAWARA">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">

  <title>CPF Laboratory NAWARA</title>

  <style>
    /* Écran de chargement aux couleurs de l'app, retiré dès la première
       image affichée par Flutter (événement "flutter-first-frame"). */
    html, body { margin: 0; height: 100%; background: #0B1E2D; }
    #splash {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
      background: radial-gradient(1200px 600px at 50% 120%, rgba(255, 122, 51, .35), transparent 60%), #0B1E2D;
      color: #F5EDE8;
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
      transition: opacity .35s ease;
    }
    #splash.hidden { opacity: 0; pointer-events: none; }
    #splash img {
      width: 96px; height: 96px; border-radius: 24px;
      box-shadow: 0 18px 50px rgba(255, 122, 51, .35);
      animation: pop .6s cubic-bezier(.2, .9, .3, 1.2) both;
    }
    #splash h1 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: .3px; }
    #splash p { margin: -12px 0 0; font-size: 14px; opacity: .7; }
    #splash .bar { width: 160px; height: 4px; border-radius: 4px; background: rgba(255, 255, 255, .12); overflow: hidden; }
    #splash .bar::after {
      content: ""; display: block; width: 40%; height: 100%; border-radius: 4px; background: #FF7A33;
      animation: slide 1.1s ease-in-out infinite;
    }
    @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
    @keyframes pop { from { transform: scale(.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { #splash img, #splash .bar::after { animation: none; } }
  </style>
</head>
<body>
  <div id="splash" role="status" aria-live="polite">
    <img src="icons/Icon-192.png" alt="">
    <h1>CPF Laboratory NAWARA</h1>
    <p>Suivi des analyses de puits</p>
    <div class="bar"></div>
  </div>
  <noscript>
    <p style="color:#fff;text-align:center;font-family:sans-serif;margin-top:40vh">
      CPF Laboratory NAWARA nécessite JavaScript.
    </p>
  </noscript>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (!splash) return;
      splash.classList.add('hidden');
      setTimeout(function () { splash.remove(); }, 400);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
