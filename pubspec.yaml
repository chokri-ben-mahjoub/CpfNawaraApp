name: cpf_nawara_suivi
description: "Suivi Puits - CPF Nawara (connexion et design)"
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management & navigation
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1

  # Préférences locales (langue choisie, onboarding vu)
  shared_preferences: ^2.3.4

  # UI
  google_fonts: ^6.2.1

  # Utils
  intl: ^0.20.3
  uuid: ^4.5.1

  # Backend partagé (mobile + future app web) : Firebase Auth + Firestore.
  # Firestore gère lui-même le cache local et la synchronisation hors-ligne,
  # donc plus besoin d'une base locale ni d'un service de synchro maison.
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.5.1

  path_provider: ^2.1.5

  # Export Excel + partage du fichier généré
  excel: ^4.0.6
  share_plus: ^10.1.3

  # Déverrouillage rapide (code à 4 chiffres + empreinte) après une 1ère
  # connexion email/mot de passe
  local_auth: ^2.3.0
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
